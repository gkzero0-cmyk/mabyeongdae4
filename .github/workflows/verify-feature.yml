name: Verify feature branch

on:
  push:
    branches:
      - feat/comment-history-classification

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check app.js
      - run: node --check ranking-utils.js
      - run: node --check api/comments.js
