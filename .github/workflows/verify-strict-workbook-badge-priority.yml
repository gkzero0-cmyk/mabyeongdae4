name: Apply and verify strict workbook badge priority
on:
  push:
    branches:
      - fix/strict-workbook-badge-priority
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'chore: run strict badge patch and live audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Apply authoritative workbook priority
        run: python scripts/apply-strict-badge-fix.py
      - name: Run full regression suite
        run: npm test
      - name: Check syntax
        run: |
          node --check app.js
          node --check ranking-utils.js
          node --check ranking-overrides.js
          node --check theme.js
          node --check api/comments.js
      - name: Audit all live verified-ID applicants against workbook
        run: |
          node -e "const u=require('./ranking-overrides'),a=require('./api/comments');(async()=>{const p=await a.buildPayload();let v=0,m=[];for(const x of p.comments||[]){const id=String(x.userId||'').trim().toLowerCase(),w=u.SOOP_SEASON_ID_MAP[id];if(!w)continue;v++;const c=u.getMabyeongdaeSeasons(x);if(JSON.stringify(w)!==JSON.stringify(c))m.push({id,nick:x.userNick,workbook:w,current:c})}console.log('LIVE_TOTAL',p.total);console.log('VERIFIED_ID_APPLICANTS',v);console.log('STRICT_PRIORITY_MISMATCHES',m.length);if(m.length){console.log(JSON.stringify(m,null,2));process.exit(1)}})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking-overrides.js index.html
          git commit -m "fix: make updated workbook authoritative for season badges"
          git push origin HEAD:fix/strict-workbook-badge-priority
