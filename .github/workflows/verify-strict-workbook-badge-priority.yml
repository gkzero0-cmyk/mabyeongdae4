name: Verify strict workbook badge priority
on:
  push:
    branches:
      - fix/strict-workbook-badge-priority
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm test
      - run: node --check ranking-overrides.js
