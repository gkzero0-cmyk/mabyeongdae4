name: Branch Verify

on:
  push:
    branches:
      - fix/classification-and-load-optimization

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply implementation patch
        run: node tools/apply-classification-load-patch.js
      - run: npm test
      - run: node --check app.js
      - run: node --check ranking-utils.js
      - run: node --check ranking-overrides.js
      - run: node --check theme.js
      - run: node --check api/comments.js
      - name: Audit live applicant classification
        run: |
          node <<'NODE'
          const api = require('./api/comments');
          const utils = require('./ranking-overrides');

          function firstMeaningfulLine(comment) {
            return String(comment || '').split(/\n+/).map(x => x.trim()).find(Boolean) || '';
          }

          function clearDeclaredRole(comment) {
            const text = String(comment || '');
            const first = firstMeaningfulLine(text).replace(/^[^\p{L}\p{N}]*/u, '').trim();
            const mixed = /간부\s*(?:OR|또는|혹은|&|\/|\|)\s*(?:행정병|훈련병|훈병|병사|병)|(?:행정병|훈련병|훈병|병사|병)\s*(?:OR|또는|혹은|&|\/|\|)\s*간부/iu;
            if (mixed.test(first)) return '';
            if (/^(?:일반\s*)?(?:행정병|훈련병|훈병|병사|병)(?=$|[\s\/|,;:：()[\]{}<>·&-])/u.test(first)) return 'soldier';
            if (/^(?:일반\s*)?간부(?=$|[\s\/|,;:：()[\]{}<>·&-])/u.test(first)) return 'officer';

            const field = text.match(/(?:신청|지원)\s*분야\s*(?:[:：\/|\-]\s*)?([^\n]{1,80})/i);
            if (!field) return '';
            const value = field[1].split(/\s*(?:\/|\|)\s*(?=(?:마크|마병대|서버|경험|자기|소개|지원동기|특이사항))/i)[0];
            const hasOfficer = /간부/i.test(value);
            const hasSoldier = /행정병|훈련병|훈병|병사|(?:^|[^\p{L}\p{N}])병(?=$|[^\p{L}\p{N}])/iu.test(value);
            if (hasOfficer && hasSoldier) return '';
            return hasOfficer ? 'officer' : hasSoldier ? 'soldier' : '';
          }

          (async () => {
            const payload = await api.buildPayload();
            const rows = payload.comments || [];
            const classified = rows.map(item => ({ item, type: utils.detectApplicantType(item.comment) }));
            const counts = classified.reduce((acc, row) => {
              acc[row.type] = (acc[row.type] || 0) + 1;
              return acc;
            }, {});
            const unknown = classified.filter(row => row.type === 'unknown');
            const falseUnknown = unknown.filter(row => clearDeclaredRole(row.item.comment));

            console.log(`AUDIT total=${rows.length} soldier=${counts.soldier || 0} officer=${counts.officer || 0} unknown=${counts.unknown || 0}`);
            console.log('UNKNOWN_LIST');
            for (const row of unknown) {
              console.log(`${row.item.userId}\t${row.item.userNick}\t${firstMeaningfulLine(row.item.comment).slice(0, 180)}`);
            }
            if (falseUnknown.length) {
              console.error('CLEAR_DECLARATION_BUT_UNKNOWN');
              for (const row of falseUnknown) console.error(`${row.item.userId}\t${row.item.userNick}\t${firstMeaningfulLine(row.item.comment)}`);
              process.exit(1);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit verified implementation
        run: |
          git config user.name "gkzero0-cmyk"
          git config user.email "gkzero0@gmail.com"
          git add ranking-overrides.js app.js api/comments.js vercel.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: improve classification and shared live cache"
            git push origin HEAD:fix/classification-and-load-optimization
          fi
