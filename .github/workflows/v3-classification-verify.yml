name: V3 Classification Verify

on:
  push:
    branches:
      - fix/v3-authoritative-applicant-types

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node --check app.js
      - run: node --check ranking-utils.js
      - run: node --check ranking-overrides.js
      - run: node --check theme.js
      - run: node --check api/comments.js
