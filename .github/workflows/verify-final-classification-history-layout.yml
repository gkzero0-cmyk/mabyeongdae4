name: Verify final classification history layout

on:
  push:
    branches:
      - verify/final-classification-history-layout-20260909

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check app.js
      - run: node --check ranking-utils.js
      - run: node --check ranking-overrides.js
      - run: node --check api/comments.js
