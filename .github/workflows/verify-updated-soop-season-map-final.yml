name: Verify updated SOOP season map final
on:
  push:
    branches:
      - verify/updated-soop-season-map-final
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm test
      - run: node --check app.js
      - run: node --check ranking-utils.js
      - run: node --check ranking-overrides.js
      - run: node --check theme.js
      - run: node --check api/comments.js
