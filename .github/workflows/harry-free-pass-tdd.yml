name: Harry free-pass TDD

on:
  push:
    branches:
      - feature/harry-free-pass

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/harry-free-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal production change
        run: |
          node <<'NODE'
          const fs = require('fs');
          const rankingPath = 'ranking-utils.js';
          const indexPath = 'index.html';
          let ranking = fs.readFileSync(rankingPath, 'utf8');
          ranking = ranking.replace(
            "const FREE_PASS_NAMES = Object.freeze(['니니', '망구랑', '유연서', '부르', '새잎', '울산큰고래']);",
            "const FREE_PASS_NAMES = Object.freeze(['니니', '망구랑', '유연서', '부르', '새잎', '울산큰고래', '해리']);"
          );
          fs.writeFileSync(rankingPath, ranking);

          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace('ranking-utils.js?v=20260909c', 'ranking-utils.js?v=20260912d');
          fs.writeFileSync(indexPath, index);
          NODE
      - name: Verify focused test passes
        run: node --test tests/harry-free-pass.test.js
      - name: Commit implementation
        run: |
          if git diff --quiet -- ranking-utils.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking-utils.js index.html
          git commit -m "feat: add Harry to free-pass roster"
          git push origin HEAD:feature/harry-free-pass
